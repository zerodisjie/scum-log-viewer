<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCUM 服务器日志查看器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">SCUM</span>
    <span class="brand-text">日志查看器</span>
    <span class="ver" id="appVer">v0.1.6</span>
  </div>

  <div class="pathbox" id="pathBox" title="当前日志目录（点「打开目录」可切换）">
    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M1.5 3.5h4l1.2 1.4h7.8v8.6h-13z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    <span id="pathText">未选择目录</span>
  </div>

  <div class="spacer"></div>

  <button class="btn" id="btnDir">打开目录</button>
  <button class="btn" id="btnReload" title="重新读取日志">刷新</button>
  <label class="switch" title="实时跟随文件变化">
    <input type="checkbox" id="chkFollow"><span></span>实时
  </label>
  <button class="btn icon" id="btnTheme" title="切换明暗">◐</button>
</header>

<main>
  <!-- 左：文件列表 -->
  <aside class="sidebar">
    <div class="side-head">
      <span>日志类型</span>
      <span class="badge" id="fileCount">0</span>
    </div>
    <div class="filelist" id="fileList"></div>
  </aside>

  <!-- 中：日志 -->
  <section class="content">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.4"/></svg>
        <input id="q" type="text" placeholder="搜索玩家名 / SteamID / IP / 关键词…" autocomplete="off" spellcheck="false">
        <button class="clear" id="qClear" hidden>×</button>
      </div>
      <select id="level" class="sel">
        <option value="all">全部级别</option>
        <option value="error">仅错误</option>
        <option value="warn">仅警告</option>
        <option value="info">仅信息</option>
      </select>
      <select id="range" class="sel">
        <option value="0">全部时间</option>
        <option value="1">最近 1 小时</option>
        <option value="6">最近 6 小时</option>
        <option value="24">最近 24 小时</option>
      </select>
      <label class="switch mini" title="隐藏引擎启动时打印的配置行，只留真实事件">
        <input type="checkbox" id="chkNoise"><span></span>隐藏噪声
      </label>
      <div class="spacer"></div>
      <span class="result-count" id="count">—</span>
      <button class="btn small" id="btnExport" title="导出当前筛选结果">导出</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="log-head" id="logHead"></div>
    <div class="log-wrap" id="logWrap">
      <div class="log-spacer" id="logSpacer">
        <div class="log-view" id="logView"></div>
      </div>
      <div class="empty" id="empty">
        <div class="empty-icon">▤</div>
        <p id="emptyText">点左侧的类型按钮查看合并后的时间线</p>
        <p class="hint">同类型不同日期的日志会自动合并，按时间排序</p>
      </div>
      <button class="loadmore" id="loadMore" hidden>加载更早的记录</button>
    </div>
  </section>

  <!-- 右：统计 -->
  <aside class="inspector">
    <div class="ins-head">概览</div>
    <div class="cards" id="cards"></div>

    <div class="ins-head">类型分布</div>
    <div class="typebars" id="typeBars"></div>

    <div class="ins-head">活跃玩家 <span class="hint-mini">按出现次数</span></div>
    <div class="players" id="players"></div>

    <div class="ins-head" id="detailHead" hidden>选中事件</div>
    <div class="detail" id="detail" hidden></div>
  </aside>
</main>

<!-- 目录浏览弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong>选择日志目录</strong>
      <button class="btn icon" id="modalClose">×</button>
    </div>
    <div class="modal-path" id="modalPath"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <div class="quick" id="quickRoots"></div>
      <button class="btn primary" id="modalUse">使用此目录</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
